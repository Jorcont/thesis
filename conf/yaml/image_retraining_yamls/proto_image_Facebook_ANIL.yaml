seed: 42
name: "Facebook_image_Retraining"
algorithm: "ANIL"
lightning: True
device: "cuda" #TODO: Does not work with CPU because of different used devices
meta_training_iter: 1000
validate_every: 20
keep_checkpoints: 5
checkpoint_freq: 20

trainer_config:
  devices: 2
  strategy: 'ddp_find_unused_parameters_true'

metrics_config:
  metric_keys: ['losses', 'accuracy']

task_sampler_config:
  name: "PrototypeLearning"
  config:
    N: 20
    num_workers: 2
    splits: [0.8, 0.1, 0.1]

data_config:
  name: "Image"
  config:
    data_path: "uoft-cs/cifar100"
    m_way: 3
    K_shots: 10
    input_name: "img"
    label_name: "fine_label"

loss_config:
  name: "PrototypeLoss"
  config:
    # Contains itself another loss:
    basic_loss_config:
      name: "CrossEntropy"
      config:
        ignore_index: -100
        label_smoothing: 0.0

model_config:
  name: "ProtoPNet"
  config:
    prototype_shape:
      num_prototypes: 60
      channels: 320 # Must be same as embedded size of backbone model
      height: 1
      width: 1
    backbone_config:
      name: "ConvNext"
      config:
        num_channels: 3
        embedding_size: 320
        checkpoint: "facebook/convnextv2-atto-1k-224" # Small model
        local_checkpoint: False
        backbone_mode: True
