seed: 69
name: "pv_timeseries_lstm_v2"
algorithm: "ANIL" # "ANIL" or "MAML"
lightning: true
device: "cuda"
meta_training_iter: 3 # ~150 at least for results
validate_every: 1
first_order: true # always "true" for MAML -> FOMAML
adaptation_steps: 5
print_meta_val: true

inner_batch_size: null
zero_target_threshold: 0.001
logging_level: "DEBUG"
baseline: true

grad_log_every_n_steps: 50
grad_hist_every_n_steps: 1000
log_grad_histograms: false

meta_lr: 0.0001
fast_lr: 0.01

weight_decay: 0.0001

trainer_config:
  accelerator:  "cuda"
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 200
  limit_val_batches: 200
  limit_test_batches: 200

checkpoint_freq:    5
keep_checkpoints:   3
checkpoint_to_load: null

data_config:  
  name: "PVTimeSeries"
  config:
    excluded_plants_txt: "output/nan_audit/excluded_plants.txt"  
    plants_dir:        "data/PV_data"
    look_back_steps:  288        # 15-min intervals
    look_ahead_steps: 96         # 15-min intervals
    window_stride:     12       
    train_ratio:      0.5
    max_windows_train:  500        # cap per task — controls epoch time
    max_windows_test:   500
    gap:                288

    theta_support:    0.5
    theta_query:      0.5

    random_sampling:  false
    use_pf_tft:       false

model_config:
  name: "LSTMRegressor"
  config:
    input_size:  15     # 9 NWP + 6 engineered (solar + time)
    hidden_size: 32
    num_layers:  1
    output_size: 3      # regression. No quantiles needed
    look_ahead:  96
    dropout:     0.1

task_sampler_config:
  name: "PVTimeSeriesV2"
  config:
    N_train:     10 # batch_size
    N_val:       1
    N_test:      1
    splits:      [0.8, 0.1, 0.1]
    num_workers: 8

loss_config:
  name: "Quantile"
  config:
    quantiles:    [0.1, 0.5, 0.9]
    median_only:  false # keep it false

metrics_config:
  name:           "Regression"
  metric_keys:    ["losses", "mae"]
  generalization: false
  print_results:  true
  sample_efficiency: false
