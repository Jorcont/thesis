seed: 123
name: "pv_timeseries_tft_v2"
algorithm: "ANIL" # "ANIL" or "MAML"
lightning: true
device: "cuda"
meta_training_iter: 25
validate_every: 1
first_order: true
adaptation_steps: 5
print_meta_val: false
inner_batch_size: null
zero_target_threshold: 0.005
# inner_batch_size: 32 # Too large -> OOM

grad_log_every_n_steps: 50
grad_hist_every_n_steps: 1000
log_grad_histograms: false

meta_lr:   0.001     
fast_lr:   0.1     

# For 
# fast_lr:
#   # features:  0.001    # slow adaptation for backbone
#   head:      0.1      # fast adaptation for classifier
#   vsn_enc:   0.3

weight_decay: 0.00001

trainer_config:
  accelerator:  "auto"
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 400
  limit_val_batches: 800
  limit_test_batches: 800
  gradient_clip_val: null

checkpoint_freq:    5
keep_checkpoints:   3
checkpoint_to_load: null

data_config:
  name: "PVTimeSeries"
  config:
    excluded_plants_txt: "output/nan_audit/excluded_plants.txt"
    plants_dir:       "/mnt/data/kes/data/jdomingo/plants_clean"
    look_back_steps:  288        # 15min intervals
    look_ahead_steps: 96        # 15min intervals
    train_ratio:      0.7 # support/query ratio
    window_stride:    4
    gap:              288  # >= look_ahead_steps
    max_windows_train: 1000
    max_windows_val:   1000
    max_windows_test:  1000

    random_sampling:  false

    use_pf_tft:       false

    time_varying_known_reals:
      - "WIND_DEGREES_40M"
      - "PRESSURE_SURFACE"
      - "DIRECT_HORIZONTAL_IRRADIANCE"
      - "WIND_SPEED_40M"
      - "TEMPERATURE_2METER_ABOVE_GROUND"
      - "HUMIDITY_RELATIVE"
      - "DIFFUSE_HORIZONTAL_IRRADIANCE"
      - "SOLAR_ELEVATION"
      - "SOLAR_AZIMUTH"
      - "TIME_OF_DAY_SIN"
      - "TIME_OF_DAY_COS"
      - "DAY_OF_YEAR_SIN"
      - "DAY_OF_YEAR_COS"

    time_varying_unknown_reals:
      - "active_power_kW"

model_config:
  name: "TFTRegressor"
  config:
    enc_size:    13     # all 13 features (past window)
    dec_size:    6      # future-known only (solar + time)
    hidden_size: 128
    num_heads:   4
    num_layers:  1
    dropout:     0.1
    look_ahead:  96
    output_size: 3      # n_quantiles

loss_config:
  name: "Quantile"
  config:
    quantiles:    [0.1, 0.5, 0.9]
    median_only:  false

task_sampler_config:
  name: "PVTimeSeriesV2"
  config:
    N:           10 # batch_size
    N_val:       1
    N_test:      1
    splits:      [0.9, 0.05, 0.05]
    num_workers: 8

metrics_config:
  name:           "Regression"
  metric_keys:    ["losses", "mae"]
  generalization: false
  print_results:  true
  sample_efficiency: false