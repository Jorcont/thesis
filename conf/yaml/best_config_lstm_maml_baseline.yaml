adaptation_steps: 5
algorithm: MAML
baseline: true
checkpoint_freq: 5
checkpoint_to_load:
data_config:
  config:
    excluded_plants_txt: output/nan_audit/excluded_plants.txt
    gap: 288
    look_ahead_steps: 96
    look_back_steps: 288
    max_windows_test: 500
    max_windows_train: 500
    plants_dir: data/PV_data
    random_sampling: false
    theta_query: 0.5
    theta_support: 0.5
    train_ratio: 0.5
    use_pf_tft: false
    window_stride: 12
  name: PVTimeSeries
device: cuda
fast_lr: 0.03871668318327892
first_order: true
grad_hist_every_n_steps: 1000
grad_log_every_n_steps: 50
inner_batch_size:
keep_checkpoints: 3
lightning: true
log_grad_histograms: false
logging_level: DEBUG
loss_config:
  config:
    median_only: false
    quantiles:
    - 0.1
    - 0.5
    - 0.9
  name: Quantile
meta_lr: 0.00031582335459519014
meta_training_iter: 70
metrics_config:
  generalization: false
  metric_keys:
  - losses
  - mae
  - mse
  - rmse
  name: Regression
  print_results: true
  sample_efficiency: true
model_config:
  config:
    dropout: 0.12585323384902347
    hidden_size: 128
    input_size: 15
    look_ahead: 96
    num_layers: 3
    output_size: 3
  name: LSTMRegressor
name: pv_timeseries_lstm_v2_best_maml_baseline_seed39
print_meta_val: true
seed: 82
