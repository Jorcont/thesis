seed: 69
name: "pv_timeseries_tft_v2_baseline"
algorithm: "ANIL" # "ANIL" or "MAML"
lightning: true
device: "cuda"
meta_training_iter: 2
validate_every: 1
first_order: true
adaptation_steps: 7
print_meta_val: true
inner_batch_size: null
zero_target_threshold: 0.001
logging_level: "DEBUG"
baseline: true

grad_log_every_n_steps: 50
grad_hist_every_n_steps: 1000
log_grad_histograms: false

meta_lr:   0.00005     
fast_lr:   0.01  # not too large    

# For 
# fast_lr:
#   # features:  0.001    # slow adaptation for backbone
#   head:      0.1      # fast adaptation for classifier
#   vsn_enc:   0.3

weight_decay: 0.0001

trainer_config:
  accelerator:  "cuda"
  devices: 1
  num_sanity_val_steps: 0
  limit_train_batches: 200
  # limit_val_batches: 70
  # limit_test_batches: 7

checkpoint_freq:    5
keep_checkpoints:   3
checkpoint_to_load: null

data_config:
  name: "PVTimeSeries"
  config:
    excluded_plants_txt: "output/nan_audit/excluded_plants.txt"
    plants_dir:       "data/PV_data"

    look_back_steps:  288        # 15min intervals
    look_ahead_steps: 96        # 15min intervals
    train_ratio:      0.5 # support/Squery ratio
    window_stride:    12
    gap:              288  # >= look_ahead_steps
    theta_support:    0.15
    theta_query:      0.15
    
    # They should be of similar range
    max_windows_train: 500
    max_windows_val:   500
    max_windows_test:  500

    random_sampling:  false

    use_pf_tft:       false

    time_varying_known_reals:
      - "WIND_DEGREES_40M_SIN"
      - "WIND_DEGREES_40M_COS"
      - "PRESSURE_SURFACE"
      - "DIRECT_HORIZONTAL_IRRADIANCE"
      - "WIND_SPEED_40M"
      - "TEMPERATURE_2METER_ABOVE_GROUND"
      - "HUMIDITY_RELATIVE"
      - "DIFFUSE_HORIZONTAL_IRRADIANCE"
      - "SOLAR_ELEVATION"
      - "SOLAR_AZIMUTH_SIN"
      - "SOLAR_AZIMUTH_COS"
      - "TIME_OF_DAY_SIN"
      - "TIME_OF_DAY_COS"
      - "DAY_OF_YEAR_SIN"
      - "DAY_OF_YEAR_COS"

    time_varying_unknown_reals:
      - "active_power_kW"

model_config:
  name: "TFTRegressor"
  config:
    enc_size:    15     # all 15 features (past window)
    dec_size:    7      # future-known only (solar + time)
    hidden_size: 128
    num_heads:   4
    num_layers:  1
    dropout:     0.15
    look_ahead:  96
    output_size: 3      # n_quantiles

loss_config:
  name: "Quantile"
  config:
    quantiles:    [0.1, 0.5, 0.9]
    median_only:  false

task_sampler_config:
  name: "PVTimeSeriesV2"
  config:
    N_train: 10
    num_workers: 4
    windows_per_step: 2500
    use_query_windows: true
    # N_train:     10 # batch_size
    N_val:       1
    N_test:      1
    splits:      [0.8, 0.1, 0.1]
    # num_workers: 8

metrics_config:
  name:           "Regression"
  metric_keys: ["losses", "mae", "mse", "rmse"]
  generalization: false
  print_results:  true
  sample_efficiency: true
