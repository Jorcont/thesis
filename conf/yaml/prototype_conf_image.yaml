seed: 42
algorithm: "ANIL"
lightning: True
device: "cuda" #TODO: Does not work with CPU because of different used devices
meta_training_iter: 10
validate_every: 5

trainer_config:
  devices: 1

metrics_config:
  metric_keys: ['losses', 'accuracy']

task_sampler_config:
  name: "PrototypeLearning"
  config:
    N: 20
    num_workers: 2

data_config:
  name: "Image"
  config:
    data_path: "uoft-cs/cifar100"
    m_way: 3
    K_shots: 10
    input_name: "img"
    label_name: "fine_label"

loss_config:
  name: "PrototypeLoss"
  config:
    # Contains itself another loss:
    basic_loss_config:
      name: "CrossEntropy"
      config:
        ignore_index: -100
        label_smoothing: 0.0

model_config:
  name: "ProtoPNet"
  config:
    prototype_shape:
      num_prototypes: 2055
      channels: 1024 # Must be same as embedded size of backbone model
      height: 1
      width: 1
    backbone_config:
      name: "ConvNext"
      config:
        num_channels: 3
